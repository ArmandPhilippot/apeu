name: Lint
permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

env:
  CI: true
  FORCE_COLOR: true
  CONTACT_EMAIL: "anyone@example.test"
  SMTP_HOST: "smtp.example.test"
  SMTP_PORT: 465
  SMTP_USER: "anyone"
  SMTP_PASSWORD: "foo"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ${{ matrix.name }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Types
            script: lint:types
          - name: Scripts
            script: lint:scripts
          - name: Styles
            script: lint:styles
          - name: Spelling
            script: lint:spelling
          - name: Formatting
            script: lint:formatting
        node-version: [24.21.0]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true

      - name: Generate Astro types
        if: matrix.name == 'Scripts'
        run: pnpm astro sync

      - name: Lint
        run: pnpm run ${{ matrix.script }}
