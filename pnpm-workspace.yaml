# We don’t need to run these build scripts, so explicitly disallow them as a minor security measure.
allowBuilds:
  esbuild: false
  unrs-resolver: false
# Wait until three days after release to install new versions of packages
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@arphi/*"
  - prettier-plugin-astro@1.0.0-beta.1
  # Renovate security update: astro@7.2.8
  - astro@7.2.8
  # Renovate security update: nodemailer@10.0.9
  - nodemailer@10.0.9
# Workaround: `eslint-plugin-jsx-a11y` is not yet compatible with ESLint 10
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-jsx-a11y>eslint": "10"
